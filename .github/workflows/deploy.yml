name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/srv/zyeth/prod/current" >> "$GITHUB_OUTPUT"
          else
            echo "path=/srv/zyeth/staging/current" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist/ via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ steps.target.outputs.path }}/"

  # Deploys the submissions backend (backend/, Astro SSR) to the shared
  # staging droplet under Bun + systemd. Deliberately a SEPARATE job from
  # `deploy` above, with no `needs:` on either side — a backend failure
  # here must never block or break the static marketing-site deploy, and
  # vice versa. See backend/deploy/README.md for the full runbook this
  # codifies (provisioning, gotchas, how to enable prod).
  #
  # STAGING-ONLY for now (#33 decision): the shared droplet is
  # resource-constrained (2 vCPU / 2 GB RAM), so a prod backend process
  # was not provisioned. To enable prod: provision the host for prod (see
  # backend/deploy/README.md § Prod), extend the sudoers allowlist for
  # `zyeth-backend@prod.service`, then drop the `if:` guard below and
  # parametrize path/port/service/env-file per branch the same way the
  # `deploy` job's "Resolve deploy target" step does.
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    env:
      BACKEND_ENV: staging
      BACKEND_PATH: /srv/zyeth-backend/staging/current
      BACKEND_PORT: 3400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build backend workspace
        run: npm run build -w @zyeth/backend

      - name: Assemble deploy payload
        run: |
          set -euo pipefail
          rm -rf /tmp/backend-payload
          mkdir -p /tmp/backend-payload
          cp -r backend/dist /tmp/backend-payload/dist
          cp -r backend/drizzle /tmp/backend-payload/drizzle
          cp -r backend/src /tmp/backend-payload/src
          cp backend/package.json /tmp/backend-payload/package.json

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload payload to host scratch dir
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'rm -rf /tmp/zyeth-backend-deploy && mkdir -p /tmp/zyeth-backend-deploy'
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            /tmp/backend-payload/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/zyeth-backend-deploy/"

      - name: Sync into place, install, migrate, restart
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<REMOTE_SCRIPT
          set -euo pipefail

          # deploy user can't write BACKEND_PATH directly (owned by zyeth) —
          # sync as zyeth instead.
          sudo -u zyeth mkdir -p "${BACKEND_PATH}"
          sudo -u zyeth rsync -a --delete /tmp/zyeth-backend-deploy/ "${BACKEND_PATH}/"
          rm -rf /tmp/zyeth-backend-deploy

          # --ignore-scripts: bcrypt's native postinstall needs node, which
          # the zyeth user doesn't have on this Bun-only host. argon2 (the
          # primary hash algorithm) needs no install script and still works;
          # bcrypt is only a lazy fallback. See backend/deploy/README.md.
          sudo -u zyeth bash -c 'cd "${BACKEND_PATH}" && /opt/bun/bin/bun install --production --ignore-scripts'

          sudo -u zyeth bash -c 'cd "${BACKEND_PATH}" && set -a && . /etc/zyeth-backend/${BACKEND_ENV}.env && set +a && /opt/bun/bin/bun src/db/migrate.ts'

          sudo systemctl restart "zyeth-backend@${BACKEND_ENV}.service"
          REMOTE_SCRIPT

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<REMOTE_SCRIPT
          set -euo pipefail
          for i in \$(seq 1 10); do
            if curl -fsS "http://127.0.0.1:${BACKEND_PORT}/api/health" >/dev/null 2>&1; then
              echo "backend healthy"
              exit 0
            fi
            echo "waiting for backend health (\$i/10)..."
            sleep 2
          done
          echo "backend health check never returned 200" >&2
          exit 1
          REMOTE_SCRIPT
